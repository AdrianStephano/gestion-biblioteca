# URL JDBC del controlador Xerial para una base SQLite local.
# biblioteca.db se crea en el directorio de trabajo desde el que se ejecuta la aplicación.
# foreign_keys=on activa las restricciones de claves foráneas para las conexiones SQLite.
db.url=jdbc:sqlite:biblioteca.db?foreign_keys=on
# SQLite local no requiere usuario; la propiedad se carga para utilizar la API JDBC genérica.
db.user=
# SQLite local no requiere contraseña; no se guardan credenciales en este archivo.
db.password=